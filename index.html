<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Arc — Farman J</title>

<!-- PWA -->
<meta name="application-name" content="Daily Arc"/>
<meta name="apple-mobile-web-app-title" content="Daily Arc"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0a0f" id="themeColorMeta"/>
<meta name="description" content="Gamified daily quest board — Farman J · AI Generalist"/>
<link rel="manifest" id="manifestLink"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230a0a0f'/%3E%3Cpolygon points='96,20 112,68 164,68 122,98 138,148 96,118 54,148 70,98 28,68 80,68' fill='%2300e5ff'/%3E%3C/svg%3E"/>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --gold: #f5c842;
    --cyan: #00e5ff;
    --purple: #c084fc;
    --green: #4ade80;
    --red: #f87171;
  }

  [data-theme="dark"] {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --surface: #16162a;
    --border: #252540;
    --text: #e8e8ff;
    --muted: #6666aa;
    --input-bg: #0a0a0f;
    --grid-color: rgba(0,229,255,0.03);
  }

  [data-theme="light"] {
    --bg: #f0f0fa;
    --bg2: #e4e4f4;
    --surface: #ffffff;
    --border: #d0d0e8;
    --text: #1a1a3a;
    --muted: #8888bb;
    --input-bg: #f8f8ff;
    --grid-color: rgba(0,100,200,0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); pointer-events: none; z-index: 0;
  }
  [data-theme="dark"] .orb { opacity: 0.18; }
  [data-theme="light"] .orb { opacity: 0.07; }
  .orb-1 { width: 500px; height: 500px; background: #c084fc; top: -200px; right: -100px; }
  .orb-2 { width: 400px; height: 400px; background: #00e5ff; bottom: -150px; left: -100px; }
  .orb-3 { width: 300px; height: 300px; background: #f5c842; top: 40%; left: 40%; }

  .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

  /* ─── TOP BAR ─── */
  .top-bar {
    position: fixed; top: 12px; right: 16px;
    display: flex; align-items: center; gap: 12px; z-index: 100;
  }

  .sync-status {
    font-size: 11px; color: var(--muted);
    letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
  }

  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .sync-dot.live  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .sync-dot.error { background: var(--red); }

  .theme-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.3s;
  }
  .theme-btn:hover { border-color: var(--cyan); }
  .theme-btn svg { width: 16px; height: 16px; }

  [data-theme="dark"]  .icon-sun  { display: block; }
  [data-theme="dark"]  .icon-moon { display: none;  }
  [data-theme="light"] .icon-sun  { display: none;  }
  [data-theme="light"] .icon-moon { display: block; }

  /* ─── HEADER ─── */
  .header {
    display: flex; align-items: flex-start;
    justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
  }

  .header-left h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 4vw, 26px); font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(135deg, #00e5ff, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.1;
  }

  .header-left .sub {
    font-size: 13px; color: var(--muted); margin-top: 4px;
    letter-spacing: 1px; font-family: 'Noto Sans JP', sans-serif; font-weight: 300;
  }

  .date-badge {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 16px; font-size: 13px;
    color: var(--muted); letter-spacing: 1px; white-space: nowrap;
    transition: background 0.3s, border-color 0.3s;
  }

  /* ─── PLAYER CARD ─── */
  .player-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px 24px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    position: relative; overflow: hidden;
    transition: background 0.3s, border-color 0.3s;
  }

  .player-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--gold));
  }

  .rank-badge {
    width: 72px; height: 72px; border-radius: 50%;
    border: 3px solid var(--cyan); display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; position: relative;
    background: var(--bg2); box-shadow: 0 0 20px rgba(0,229,255,0.3);
    transition: background 0.3s;
  }
  .rank-badge svg { width: 36px; height: 36px; }

  .rank-ring {
    position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--cyan); border-right-color: var(--purple);
    animation: spin 4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .player-info { flex: 1; min-width: 160px; }

  .player-name {
    font-family: 'Orbitron', monospace; font-size: 16px;
    font-weight: 700; color: var(--text); letter-spacing: 1px;
  }

  .player-rank-label {
    font-size: 12px; color: var(--cyan);
    letter-spacing: 2px; text-transform: uppercase; margin-top: 2px;
  }

  .xp-bar-wrap {
    margin-top: 10px; background: var(--bg);
    border-radius: 99px; height: 8px; overflow: hidden; transition: background 0.3s;
  }

  .xp-bar {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 10px var(--cyan);
  }

  .xp-label {
    font-size: 11px; color: var(--muted); margin-top: 4px;
    display: flex; justify-content: space-between;
  }

  .stats-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .stat-box  { text-align: center; min-width: 60px; }

  .stat-val { font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-val.gold  { color: var(--gold);  text-shadow: 0 0 10px rgba(245,200,66,0.4); }
  .stat-val.cyan  { color: var(--cyan);  text-shadow: 0 0 10px rgba(0,229,255,0.4); }
  .stat-val.green { color: var(--green); text-shadow: 0 0 10px rgba(74,222,128,0.4); }

  .stat-lbl {
    font-size: 10px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase; margin-top: 2px;
  }

  /* ─── ARCS ─── */
  .arc-section { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }

  .arc-card {
    flex: 1; min-width: 120px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: background 0.3s, border-color 0.3s;
  }

  .arc-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .arc-svg   { width: 70px; height: 70px; }
  .arc-count { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; text-align: center; }

  /* ─── ADD TASK ─── */
  .add-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 24px;
    transition: background 0.3s, border-color 0.3s;
  }

  .add-section h3 {
    font-family: 'Orbitron', monospace; font-size: 13px;
    letter-spacing: 2px; color: var(--cyan); margin-bottom: 14px;
  }

  .add-form { display: flex; flex-direction: column; gap: 10px; }
  .add-row  { display: flex; gap: 10px; flex-wrap: wrap; }

  .task-input {
    flex: 1; min-width: 200px; background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 15px; outline: none;
    transition: border-color 0.2s, background 0.3s, color 0.3s;
  }
  .task-input:focus { border-color: var(--cyan); }
  .task-input::placeholder { color: var(--muted); }

  .cat-select {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 15px; outline: none; cursor: pointer;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
  }
  .cat-select:focus { border-color: var(--cyan); }

  /* custom category picker */
  .cat-picker { display: flex; gap: 6px; flex-wrap: wrap; }

  .cat-pick-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; color: var(--muted);
    font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
  }
  .cat-pick-btn:hover { border-color: var(--cyan); color: var(--text); }
  .cat-pick-btn.active[data-cat="trading"]  { border-color: #f5c842; color: #f5c842; background: rgba(245,200,66,0.08); }
  .cat-pick-btn.active[data-cat="building"] { border-color: #00e5ff; color: #00e5ff; background: rgba(0,229,255,0.08); }
  .cat-pick-btn.active[data-cat="personal"] { border-color: #c084fc; color: #c084fc; background: rgba(192,132,252,0.08); }
  .cat-pick-btn.active[data-cat="health"]   { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.08); }

  .add-btn {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    border: none; border-radius: 8px; padding: 10px 22px;
    color: #000; font-family: 'Orbitron', monospace; font-size: 13px;
    font-weight: 700; letter-spacing: 1px; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s; white-space: nowrap;
  }
  .add-btn:hover  { opacity: 0.85; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }

  /* ─── TASKS ─── */
  .category-section { margin-bottom: 22px; }

  .cat-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border); transition: border-color 0.3s;
  }

  .cat-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .cat-title {
    font-family: 'Orbitron', monospace; font-size: 13px;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  }

  .cat-count { font-size: 12px; color: var(--muted); margin-left: auto; }

  .task-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.2s, opacity 0.3s, background 0.3s;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .task-item.done { opacity: 0.5; }
  .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

  .task-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; background: var(--input-bg);
  }
  .task-check:hover   { border-color: var(--cyan); }
  .task-check.checked { border-color: transparent; }
  .task-check.checked svg { display: block; }
  .task-check svg { display: none; width: 14px; height: 14px; }

  .task-text { flex: 1; font-size: 15px; color: var(--text); line-height: 1.4; }

  .task-xp {
    font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 99px; background: var(--bg);
    border: 1px solid var(--border); white-space: nowrap; transition: background 0.3s;
  }

  .task-delete, .task-edit {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 4px; border-radius: 4px; display: flex; align-items: center;
    transition: color 0.2s; flex-shrink: 0;
  }
  .task-delete:hover { color: var(--red); }
  .task-edit:hover   { color: var(--cyan); }

  /* inline edit input */
  .task-edit-input {
    flex: 1; background: var(--input-bg);
    border: 1px solid var(--cyan); border-radius: 6px;
    padding: 4px 10px; color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 15px; outline: none;
  }

  .task-save-btn {
    background: var(--cyan); border: none; border-radius: 6px;
    padding: 4px 12px; color: #000;
    font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: opacity 0.2s;
  }
  .task-save-btn:hover { opacity: 0.8; }

  .empty-state {
    text-align: center; color: var(--muted);
    font-size: 13px; padding: 20px; letter-spacing: 1px;
  }

  /* ─── LEVEL UP ─── */
  .levelup-overlay {
    position: fixed; inset: 0; background: rgba(0,229,255,0.06);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  .levelup-overlay.show { opacity: 1; }

  .levelup-box {
    font-family: 'Orbitron', monospace; font-size: clamp(28px, 8vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center; letter-spacing: 4px; animation: levelPulse 0.5s ease;
  }

  @keyframes levelPulse {
    0%   { transform: scale(0.5); }
    70%  { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  /* ─── TOAST ─── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--cyan);
    border-radius: 8px; padding: 10px 20px; font-size: 14px;
    letter-spacing: 1px; color: var(--cyan); z-index: 9998; opacity: 0;
    transition: all 0.3s; white-space: nowrap;
    box-shadow: 0 0 20px rgba(0,229,255,0.15);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── MONTHLY REPORT MODAL ─── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px); z-index: 9000;
    display: flex; align-items: flex-start; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
    overflow-y: auto; padding: 20px 16px 40px;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }

  .report-modal {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 20px; width: 100%; max-width: 480px;
    overflow: hidden; position: relative;
    animation: slideUp 0.35s cubic-bezier(.4,0,.2,1);
    transition: background 0.3s, border-color 0.3s;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .report-modal::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--gold));
  }

  .report-header {
    padding: 24px 24px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .report-title {
    font-family: 'Orbitron', monospace; font-size: 14px;
    font-weight: 900; letter-spacing: 2px; color: var(--cyan);
  }

  .report-close {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 4px; display: flex; align-items: center;
    transition: color 0.2s;
  }
  .report-close:hover { color: var(--red); }

  /* month nav */
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px 20px; gap: 12px;
  }

  .month-nav-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; color: var(--muted);
    font-family: 'Orbitron', monospace; font-size: 11px;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .month-nav-btn:hover { border-color: var(--cyan); color: var(--cyan); }

  .month-label {
    font-family: 'Orbitron', monospace; font-size: 13px;
    font-weight: 700; color: var(--text); letter-spacing: 1px;
  }

  /* report card — captured by html2canvas */
  #reportCard {
    margin: 0 16px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    transition: background 0.3s, border-color 0.3s;
  }

  .report-card-title {
    font-family: 'Orbitron', monospace; font-size: 11px;
    letter-spacing: 2px; color: var(--muted); margin-bottom: 16px;
    text-align: center; text-transform: uppercase;
  }

  .report-stats-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 16px;
  }

  .report-stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; text-align: center;
    transition: background 0.3s, border-color 0.3s;
  }

  .report-stat-val {
    font-family: 'Orbitron', monospace; font-size: 20px;
    font-weight: 700; line-height: 1;
  }

  .report-stat-lbl {
    font-size: 10px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase; margin-top: 4px;
  }

  .report-cat-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .report-cat-row:last-child { border-bottom: none; }

  .report-cat-name {
    flex: 1; font-size: 13px; font-weight: 600;
    letter-spacing: 0.5px; color: var(--text);
  }

  .report-cat-xp {
    font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
  }

  .report-cat-count {
    font-size: 12px; color: var(--muted); min-width: 40px; text-align: right;
  }

  .report-best-day {
    margin-top: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.3s, border-color 0.3s;
  }

  .report-best-day-lbl { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .report-best-day-val { font-family: 'Orbitron', monospace; font-size: 12px; color: var(--gold); font-weight: 700; }

  .report-motto {
    margin-top: 14px; text-align: center;
    font-size: 12px; color: var(--muted);
    font-style: italic; letter-spacing: 0.5px; line-height: 1.5;
  }

  .report-brand {
    margin-top: 8px; text-align: center;
    font-family: 'Orbitron', monospace; font-size: 10px;
    color: var(--cyan); letter-spacing: 2px; opacity: 0.7;
  }

  /* wins section */
  .wins-section { margin-top: 14px; }

  .wins-section-title {
    font-family: 'Orbitron', monospace; font-size: 10px;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }

  .wins-section-title::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .wins-cat-block { margin-bottom: 12px; }

  .wins-cat-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }

  .win-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 10px; background: var(--surface);
    border-radius: 6px; margin-bottom: 4px;
    font-size: 12px; color: var(--text); line-height: 1.4;
    transition: background 0.3s;
  }

  .win-check {
    width: 14px; height: 14px; border-radius: 50%;

    self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(n=>n!==CACHE).map(n=>caches.delete(n)))));self.clients.claim();});
    self.addEventListener('fetch',e=>{if(e.request.url.includes('supabase')||e.request.url.includes('googleapis'))return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});
  `;
  navigator.serviceWorker.register(
    URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }))
  ).catch(() => {});
}

// ─── AUDIO ───────────────────────────────────────────────────────────────
const actx = new (window.AudioContext || window.webkitAudioContext)();

function tone(freq, dur, type='sine', vol=0.2, delay=0) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime + delay);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + delay + dur);
  o.start(actx.currentTime + delay);
  o.stop(actx.currentTime + delay + dur);
}

function playAdd()      { tone(400,0.08); tone(600,0.15,undefined,undefined,0.08); }
function playComplete() { tone(523,0.1); tone(659,0.1,undefined,undefined,0.1); tone(784,0.3,undefined,undefined,0.2); }
function playLevelUp()  { [523,659,784,1047].forEach((f,i) => tone(f, 0.3, 'triangle', 0.25, i*0.12)); }

// ─── SUPABASE ────────────────────────────────────────────────────────────
async function sb(method, table, body, query='') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    method, headers: HEADERS, body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

const loadTasks    = ()       => sb('GET',    'daily_tasks',   null, `?date=eq.${todayStr}&order=created_at.asc`);
const insertTask   = t        => sb('POST',   'daily_tasks',   t);
const updateTask   = (id, p)  => sb('PATCH',  'daily_tasks',   p,    `?id=eq.${id}`);
const deleteTask   = id       => sb('DELETE', 'daily_tasks',   null, `?id=eq.${id}`);
const loadProgress = ()       => sb('GET',    'user_progress', null, '?limit=1');

async function saveProgress(p) {
  const ex = await loadProgress();
  if (ex && ex.length) return sb('PATCH', 'user_progress', p, `?id=eq.${ex[0].id}`);
  return sb('POST', 'user_progress', p);
}

// ─── RANK ─────────────────────────────────────────────────────────────────
function getRank(xp) {
  for (let i = RANKS.length - 1; i >= 0; i--)
    if (xp >= RANKS[i].min) return { ...RANKS[i], index: i };
  return { ...RANKS[0], index: 0 };
}

// ─── STREAK ──────────────────────────────────────────────────────────────
function calcStreak(p) {
  if (!p.last_active_date) return 1;
  const diff = Math.round((new Date(todayStr) - new Date(p.last_active_date)) / 86400000);
  return diff === 0 ? p.streak : diff === 1 ? p.streak + 1 : 1;
}

// ─── UI ──────────────────────────────────────────────────────────────────
function updatePlayerCard() {
  const rank = getRank(progress.total_xp);
  const next = RANKS[rank.index + 1] || rank;
  const pct  = rank.index < RANKS.length - 1
    ? Math.min(100, ((progress.total_xp - rank.min) / (next.min - rank.min)) * 100)
    : 100;

  document.getElementById('rankLabel').textContent  = rank.name;
  document.getElementById('xpBar').style.width      = pct + '%';
  document.getElementById('xpCurrent').textContent  = progress.total_xp + ' XP';
  document.getElementById('xpNext').textContent     = rank.index < RANKS.length - 1 ? '→ ' + next.min + ' XP' : 'MAX RANK';
  document.getElementById('statStreak').textContent = progress.streak;
  document.getElementById('statXP').textContent     = progress.total_xp;
  document.getElementById('statDone').textContent   = tasks.filter(t => t.completed).length;

  if (rank.index > prevLevel) { prevLevel = rank.index; showLevelUp(rank.name); }
}

function showLevelUp(name) {
  playLevelUp();
  const ov = document.getElementById('levelupOverlay');
  document.getElementById('levelupText').textContent = 'RANK UP! ' + name;
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 2200);
}

  card.innerHTML = `
    <div class="arc-label">${label}</div>

      <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${color}" stroke-width="5"
        stroke-dasharray="${CIRC * pct} ${CIRC}" stroke-dashoffset="${CIRC * 0.25}"

async function saveEdit(id) {
  const input = document.getElementById('edit-input-' + id);
  if (!input) return;
  const newTitle = input.value.trim();
  if (!newTitle) { showToast('Quest title cannot be empty'); return; }
  const task = tasks.find(t => t.id == id);
  if (!task) return;
  try {
    await updateTask(id, { title: newTitle });
    task.title = newTitle;
    renderTasks(); renderArcs();
    showToast('Quest updated');
  } catch(e) { showToast('Update error'); console.error(e); }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function selectCat(btn) {
  document.querySelectorAll('.cat-pick-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function getSelectedCat() {
  const active = document.querySelector('.cat-pick-btn.active');
  return active ? active.dataset.cat : 'trading';
}

async function addTask() {
  const input = document.getElementById('taskInput');
  const cat   = getSelectedCat();
  const title = input.value.trim();
  if (!title) { showToast('Write your quest first'); return; }
  try {
    const [saved] = await insertTask({ title, category: cat, completed: false, xp: CATEGORIES[cat].xp, date: todayStr });
    tasks.push(saved);
    input.value = '';
    playAdd();
    renderTasks(); renderArcs(); updatePlayerCard();
    showToast('Quest added! +' + CATEGORIES[cat].xp + ' XP on completion');
  } catch(e) { showToast('Error saving quest'); console.error(e); }
}

async function toggleTask(id, wasDone) {
  const nowDone = !wasDone;
  const task    = tasks.find(t => t.id == id);
  if (!task) return;
  try {
    await updateTask(id, { completed: nowDone });
    task.completed = nowDone;
    if (nowDone) { progress.total_xp += task.xp; playComplete(); showToast('Quest complete! +' + task.xp + ' XP'); }
    else         { progress.total_xp = Math.max(0, progress.total_xp - task.xp); }
    progress.last_active_date = todayStr;
    await saveProgress(progress);
    renderTasks(); renderArcs(); updatePlayerCard();
  } catch(e) { showToast('Sync error'); console.error(e); }
}

async function removeTask(id, xp, wasDone) {
  try {
    await deleteTask(id);
    if (wasDone) progress.total_xp = Math.max(0, progress.total_xp - xp);
    tasks = tasks.filter(t => t.id != id);
    await saveProgress(progress);
    renderTasks(); renderArcs(); updatePlayerCard();
    showToast('Quest removed');
  } catch(e) { showToast('Delete error'); console.error(e); }
}

// ─── INIT ─────────────────────────────────────────────────────────────────
function setSyncStatus(s) {
  document.getElementById('syncDot').className   = 'sync-dot ' + (s === 'live' ? 'live' : s === 'error' ? 'error' : '');
  document.getElementById('syncLabel').textContent = s === 'live' ? 'synced' : s === 'error' ? 'offline' : 'connecting...';
}

async function init() {
  document.getElementById('dateBadge').textContent =
    new Date().toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
  setSyncStatus('connecting');
  try {
    const [rawTasks, rawProg] = await Promise.all([loadTasks(), loadProgress()]);
    tasks = rawTasks || [];
    if (rawProg && rawProg.length) {
      progress = rawProg[0];
      progress.streak = calcStreak(rawProg[0]);
      if (rawProg[0].last_active_date !== todayStr)
        await saveProgress({ streak: progress.streak, last_active_date: todayStr });
    } else {
      progress = { total_xp: 0, streak: 1, level: 0, last_active_date: todayStr };
      await saveProgress(progress);
    }
    prevLevel = getRank(progress.total_xp).index;
    // rollover missed tasks from previous days
    await rolloverMissedTasks();
    renderTasks(); renderArcs(); updatePlayerCard();
    setSyncStatus('live');
  } catch(e) {
    setSyncStatus('error');
    showToast('Could not connect to Supabase');
    console.error(e);
  }
}

document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
init();

// ─── ROLLOVER MISSED TASKS ────────────────────────────────────────────────
async function rolloverMissedTasks() {
  try {
    // fetch all incomplete tasks before today
    const missed = await sb('GET', 'daily_tasks', null,
      `?date=lt.${todayStr}&completed=eq.false&order=date.asc`);
    if (!missed || !missed.length) return;

    // move each missed task to today by updating its date
    await Promise.all(missed.map(t => updateTask(t.id, { date: todayStr })));

    // reload today's tasks to include rolled over ones
    const refreshed = await loadTasks();
    tasks = refreshed || [];

    if (missed.length === 1) showToast(`1 missed quest rolled over to today`);
    else if (missed.length > 1) showToast(`${missed.length} missed quests rolled over to today`);
  } catch(e) {
    console.error('Rollover error:', e);
  }
}

  const monthName = reportDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const rank = getRank(progress.total_xp);
  const xpEl  = document.querySelector('#reportStatsGrid .report-stat:nth-child(1) .report-stat-val');
  const doneEl = document.querySelector('#reportStatsGrid .report-stat:nth-child(2) .report-stat-val');
  const xp    = xpEl  ? xpEl.textContent  : '0';
  const done  = doneEl ? doneEl.textContent : '0';

  const pageW = 210;
  const margin = 20;
  const contentW = pageW - margin * 2;
  let y = 20;

  // ── background
  doc.setFillColor(10, 10, 15);
  doc.rect(0, 0, 210, 297, 'F');

  // ── top accent line
  doc.setDrawColor(0, 229, 255);
  doc.setLineWidth(1);
  doc.line(margin, y, pageW - margin, y);
  y += 10;

  // ── title
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(0, 229, 255);
  doc.text('DAILY ARC', margin, y);
  y += 7;

  doc.setFontSize(11);
  doc.setTextColor(192, 132, 252);
  doc.text(`VICTORY LOG · ${monthName.toUpperCase()}`, margin, y);
  y += 5;

  doc.setDrawColor(37, 37, 64);
  doc.setLineWidth(0.3);
  doc.line(margin, y, pageW - margin, y);
  y += 8;

  // ── stats summary bar
  doc.setFontSize(9);
  doc.setTextColor(102, 102, 170);
  doc.text(`Rank: ${rank.name}   |   XP Earned: ${xp}   |   Quests Done: ${done}   |   Streak: ${progress.streak} days`, margin, y);
  y += 8;

  doc.setDrawColor(37, 37, 64);
  doc.line(margin, y, pageW - margin, y);
  y += 10;

  // ── category wins with dates — from raw Supabase data
  const CAT_COLORS = {
    trading:  [245, 200, 66],
    building: [0,   229, 255],
    personal: [192, 132, 252],
    health:   [74,  222, 128]
  };

  const doneTasks = reportMonthTasks.filter(t => t.completed);

  if (!doneTasks.length) {
    doc.setTextColor(102, 102, 170);
    doc.setFontSize(11);
    doc.text('No completed quests this month yet.', margin, y);
  } else {
    Object.keys(CATEGORIES).forEach(cat => {
      const catTasks = doneTasks.filter(t => t.category === cat);
      if (!catTasks.length) return;
      const [r, g, b] = CAT_COLORS[cat] || [255,255,255];

      if (y > 265) { doc.addPage(); doc.setFillColor(10,10,15); doc.rect(0,0,210,297,'F'); y = 20; }

      // category header
      doc.setFillColor(22, 22, 42);
      doc.roundedRect(margin, y - 4, contentW, 10, 2, 2, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(r, g, b);
      doc.text(CATEGORIES[cat].label.toUpperCase(), margin + 4, y + 2);
      y += 12;

      catTasks.forEach(task => {
        if (y > 270) { doc.addPage(); doc.setFillColor(10,10,15); doc.rect(0,0,210,297,'F'); y = 20; }

        // date label on right
        const dateStr = new Date(task.date).toLocaleDateString('en-GB', { day:'2-digit', month:'short' }).toUpperCase();

        // checkmark dot
        doc.setFillColor(r, g, b);
        doc.circle(margin + 2, y - 1, 1.2, 'F');

        // task title
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(232, 232, 255);
        const maxTitleW = contentW - 30; // leave room for date
        const lines = doc.splitTextToSize(task.title, maxTitleW);
        doc.text(lines, margin + 6, y);

        // date — right aligned, muted
        doc.setTextColor(102, 102, 170);
        doc.setFontSize(8);
        doc.text(dateStr, pageW - margin, y, { align: 'right' });

        y += lines.length * 5 + 2;
      });

      y += 4;
    });
  }

  // ── footer
  if (y > 270) { doc.addPage(); doc.setFillColor(10,10,15); doc.rect(0,0,210,297,'F'); y = 20; }
  y = Math.max(y + 6, 275);
  doc.setDrawColor(0, 229, 255);
  doc.setLineWidth(0.5);
  doc.line(margin, y, pageW - margin, y);
  y += 6;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(102, 102, 170);
  doc.text('DAILY ARC · FARMAN J · AI GENERALIST · farman024.github.io/Daily-Arc', margin, y);

  // ── save
  const fileName = `DailyArc-VictoryLog-${monthName.replace(' ', '-')}.pdf`;
  doc.save(fileName);
  showToast('Victory Log PDF saved!');
}

async function downloadImage() {
  const card = document.getElementById('reportCard');
  showToast('Generating image...');
  try {
    const canvas = await html2canvas(card, {
      backgroundColor: '#0a0a0f',
      scale: 2,
      useCORS: true,
      logging: false
    });
    const link = document.createElement('a');
    const monthName = reportDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }).replace(' ', '-');
    link.download = `DailyArc-${monthName}-Report.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('Image saved!');
  } catch(e) {
    showToast('Image generation failed');
    console.error(e);
  }
}
</script>
</body>
</html>
