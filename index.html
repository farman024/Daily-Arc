<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Arc — Farman J</title>

<meta name="apple-mobile-web-app-title" content="Daily Arc"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet"/>

<style>
  :root {
    --gold: #f5c842;
    --cyan: #00e5ff;
    --purple: #c084fc;
    --green: #4ade80;
    --red: #f87171;
  }

  [data-theme="dark"] {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --surface: #16162a;
    --border: #252540;
    --text: #e8e8ff;
    --muted: #6666aa;
    --input-bg: #0a0a0f;
    --grid-color: rgba(0,229,255,0.03);
  }

  [data-theme="light"] {
    --bg: #f0f0fa;
    --bg2: #e4e4f4;
    --surface: #ffffff;
    --border: #d0d0e8;
    --text: #1a1a3a;
    --muted: #8888bb;
    --input-bg: #f8f8ff;
    --grid-color: rgba(0,100,200,0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); pointer-events: none; z-index: 0;
  }
  [data-theme="dark"] .orb { opacity: 0.18; }
  [data-theme="light"] .orb { opacity: 0.07; }
  .orb-1 { width: 500px; height: 500px; background: #c084fc; top: -200px; right: -100px; }
  .orb-2 { width: 400px; height: 400px; background: #00e5ff; bottom: -150px; left: -100px; }
  .orb-3 { width: 300px; height: 300px; background: #f5c842; top: 40%; left: 40%; }

  .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

  /* ─── TOP BAR ─── */
  .top-bar {
    position: fixed; top: 12px; right: 16px;
    display: flex; align-items: center; gap: 12px; z-index: 100;
  }

  .sync-status {
    font-size: 11px; color: var(--muted);
    letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
  }

  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .sync-dot.live  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .sync-dot.error { background: var(--red); }

  .theme-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.3s;
  }
  .theme-btn:hover { border-color: var(--cyan); }
  .theme-btn svg { width: 16px; height: 16px; }

  [data-theme="dark"]  .icon-sun  { display: block; }
  [data-theme="dark"]  .icon-moon { display: none;  }
  [data-theme="light"] .icon-sun  { display: none;  }
  [data-theme="light"] .icon-moon { display: block; }

  /* ─── HEADER ─── */
  .header {
    display: flex; align-items: flex-start;
    justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
  }

  .header-left h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 4vw, 26px); font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(135deg, #00e5ff, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.1;
  }

  .header-left .sub {
    font-size: 13px; color: var(--muted); margin-top: 4px;
    letter-spacing: 1px; font-family: 'Noto Sans JP', sans-serif; font-weight: 300;
  }

  .date-badge {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 16px; font-size: 13px;
    color: var(--muted); letter-spacing: 1px; white-space: nowrap;
    transition: background 0.3s, border-color 0.3s;
  }

  /* ─── PLAYER CARD ─── */
  .player-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px 24px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    position: relative; overflow: hidden;
    transition: background 0.3s, border-color 0.3s;
  }

  .player-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--gold));
  }

  .rank-badge {
    width: 72px; height: 72px; border-radius: 50%;
    border: 3px solid var(--cyan); display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; position: relative;
    background: var(--bg2); box-shadow: 0 0 20px rgba(0,229,255,0.3);
    transition: background 0.3s;
  }
  .rank-badge svg { width: 36px; height: 36px; }

  .rank-ring {
    position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--cyan); border-right-color: var(--purple);
    animation: spin 4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .player-info { flex: 1; min-width: 160px; }

  .player-name {
    font-family: 'Orbitron', monospace; font-size: 16px;
    font-weight: 700; color: var(--text); letter-spacing: 1px;
  }

  .player-rank-label {
    font-size: 12px; color: var(--cyan);
    letter-spacing: 2px; text-transform: uppercase; margin-top: 2px;
  }

  .xp-bar-wrap {
    margin-top: 10px; background: var(--bg);
    border-radius: 99px; height: 8px; overflow: hidden; transition: background 0.3s;
  }

  .xp-bar {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 10px var(--cyan);
  }

  .xp-label {
    font-size: 11px; color: var(--muted); margin-top: 4px;
    display: flex; justify-content: space-between;
  }

  .stats-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .stat-box  { text-align: center; min-width: 60px; }

  .stat-val { font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-val.gold  { color: var(--gold);  text-shadow: 0 0 10px rgba(245,200,66,0.4); }
  .stat-val.cyan  { color: var(--cyan);  text-shadow: 0 0 10px rgba(0,229,255,0.4); }
  .stat-val.green { color: var(--green); text-shadow: 0 0 10px rgba(74,222,128,0.4); }

  .stat-lbl {
    font-size: 10px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase; margin-top: 2px;
  }

  /* ─── ARCS ─── */
  .arc-section { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }

  .arc-card {
    flex: 1; min-width: 120px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: background 0.3s, border-color 0.3s;
  }

  .arc-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .arc-svg   { width: 70px; height: 70px; }
  .arc-count { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; text-align: center; }

  /* ─── ADD TASK ─── */
  .add-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 24px;
    transition: background 0.3s, border-color 0.3s;
  }

  .add-section h3 {
    font-family: 'Orbitron', monospace; font-size: 13px;
    letter-spacing: 2px; color: var(--cyan); margin-bottom: 14px;
  }

  .add-form { display: flex; flex-direction: column; gap: 10px; }
  .add-row  { display: flex; gap: 10px; flex-wrap: wrap; }

  .task-input {
    flex: 1; min-width: 200px; background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 15px; outline: none;
    transition: border-color 0.2s, background 0.3s, color 0.3s;
  }
  .task-input:focus { border-color: var(--cyan); }
  .task-input::placeholder { color: var(--muted); }

  .cat-select {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 15px; outline: none; cursor: pointer;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
  }
  .cat-select:focus { border-color: var(--cyan); }

  .add-btn {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    border: none; border-radius: 8px; padding: 10px 22px;
    color: #000; font-family: 'Orbitron', monospace; font-size: 13px;
    font-weight: 700; letter-spacing: 1px; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s; white-space: nowrap;
  }
  .add-btn:hover  { opacity: 0.85; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }

  /* ─── TASKS ─── */
  .category-section { margin-bottom: 22px; }

  .cat-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border); transition: border-color 0.3s;
  }

  .cat-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .cat-title {
    font-family: 'Orbitron', monospace; font-size: 13px;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  }

  .cat-count { font-size: 12px; color: var(--muted); margin-left: auto; }

  .task-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.2s, opacity 0.3s, background 0.3s;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .task-item.done { opacity: 0.5; }
  .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

  .task-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; background: var(--input-bg);
  }
  .task-check:hover   { border-color: var(--cyan); }
  .task-check.checked { border-color: transparent; }
  .task-check.checked svg { display: block; }
  .task-check svg { display: none; width: 14px; height: 14px; }

  .task-text { flex: 1; font-size: 15px; color: var(--text); line-height: 1.4; }

  .task-xp {
    font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 99px; background: var(--bg);
    border: 1px solid var(--border); white-space: nowrap; transition: background 0.3s;
  }

  .task-delete {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 4px; border-radius: 4px; display: flex; align-items: center;
    transition: color 0.2s; flex-shrink: 0;
  }
  .task-delete:hover { color: var(--red); }

  .empty-state {
    text-align: center; color: var(--muted);
    font-size: 13px; padding: 20px; letter-spacing: 1px;
  }

  /* ─── LEVEL UP ─── */
  .levelup-overlay {
    position: fixed; inset: 0; background: rgba(0,229,255,0.06);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  .levelup-overlay.show { opacity: 1; }

  .levelup-box {
    font-family: 'Orbitron', monospace; font-size: clamp(28px, 8vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center; letter-spacing: 4px; animation: levelPulse 0.5s ease;
  }

  @keyframes levelPulse {
    0%   { transform: scale(0.5); }
    70%  { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  /* ─── TOAST ─── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--cyan);
    border-radius: 8px; padding: 10px 20px; font-size: 14px;
    letter-spacing: 1px; color: var(--cyan); z-index: 9998; opacity: 0;
    transition: all 0.3s; white-space: nowrap;
    box-shadow: 0 0 20px rgba(0,229,255,0.15);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  @media (max-width: 520px) {
    .player-card { flex-direction: column; align-items: flex-start; }
    .stats-row   { gap: 14px; }
    .arc-card    { min-width: 100px; }
  }
</style>
</head>

// ─── STATE ───────────────────────────────────────────────────────────────
let tasks    = [];
let progress = { total_xp: 0, streak: 0, level: 0, last_active_date: null };
let todayStr = new Date().toISOString().split('T')[0];
let prevLevel = 0;

// ─── THEME ───────────────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('da-theme', next);
  document.getElementById('themeColorMeta').content = next === 'dark' ? '#0a0a0f' : '#f0f0fa';
}

(function applyTheme() {
  const saved = localStorage.getItem('da-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeColorMeta').content = saved === 'dark' ? '#0a0a0f' : '#f0f0fa';
})();

// ─── PWA MANIFEST ────────────────────────────────────────────────────────
(function injectManifest() {
  const m = {
    name: 'Daily Arc', short_name: 'Daily Arc',
    description: 'Gamified daily quest board — Farman J',
    start_url: './', display: 'standalone',
    background_color: '#0a0a0f', theme_color: '#0a0a0f',
    orientation: 'portrait-primary',
    icons: [
      { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230a0a0f'/%3E%3Cpolygon points='96,20 112,68 164,68 122,98 138,148 96,118 54,148 70,98 28,68 80,68' fill='%2300e5ff'/%3E%3C/svg%3E", sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
      { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%230a0a0f'/%3E%3Cpolygon points='256,50 296,178 430,178 326,258 366,388 256,308 146,388 186,258 82,178 216,178' fill='%2300e5ff'/%3E%3C/svg%3E", sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(m)], { type: 'application/json' });

})();

// ─── SERVICE WORKER ───────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE='daily-arc-v1';
    self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])));self.skipWaiting();});
    self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(n=>n!==CACHE).map(n=>caches.delete(n)))));self.clients.claim();});
    self.addEventListener('fetch',e=>{if(e.request.url.includes('supabase')||e.request.url.includes('googleapis'))return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});
  `;
  navigator.serviceWorker.register(
    URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }))
  ).catch(() => {});
}

// ─── AUDIO ───────────────────────────────────────────────────────────────
const actx = new (window.AudioContext || window.webkitAudioContext)();

function tone(freq, dur, type='sine', vol=0.2, delay=0) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime + delay);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + delay + dur);
  o.start(actx.currentTime + delay);
  o.stop(actx.currentTime + delay + dur);
}

function playAdd()      { tone(400,0.08); tone(600,0.15,undefined,undefined,0.08); }
function playComplete() { tone(523,0.1); tone(659,0.1,undefined,undefined,0.1); tone(784,0.3,undefined,undefined,0.2); }
function playLevelUp()  { [523,659,784,1047].forEach((f,i) => tone(f, 0.3, 'triangle', 0.25, i*0.12)); }

// ─── SUPABASE ────────────────────────────────────────────────────────────
async function sb(method, table, body, query='') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    method, headers: HEADERS, body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

const loadTasks    = ()       => sb('GET',    'daily_tasks',   null, `?date=eq.${todayStr}&order=created_at.asc`);
const insertTask   = t        => sb('POST',   'daily_tasks',   t);
const updateTask   = (id, p)  => sb('PATCH',  'daily_tasks',   p,    `?id=eq.${id}`);
const deleteTask   = id       => sb('DELETE', 'daily_tasks',   null, `?id=eq.${id}`);
const loadProgress = ()       => sb('GET',    'user_progress', null, '?limit=1');

async function saveProgress(p) {
  const ex = await loadProgress();
  if (ex && ex.length) return sb('PATCH', 'user_progress', p, `?id=eq.${ex[0].id}`);
  return sb('POST', 'user_progress', p);
}

// ─── RANK ─────────────────────────────────────────────────────────────────
function getRank(xp) {
  for (let i = RANKS.length - 1; i >= 0; i--)
    if (xp >= RANKS[i].min) return { ...RANKS[i], index: i };
  return { ...RANKS[0], index: 0 };
}

// ─── STREAK ──────────────────────────────────────────────────────────────
function calcStreak(p) {
  if (!p.last_active_date) return 1;
  const diff = Math.round((new Date(todayStr) - new Date(p.last_active_date)) / 86400000);
  return diff === 0 ? p.streak : diff === 1 ? p.streak + 1 : 1;
}

// ─── UI ──────────────────────────────────────────────────────────────────
function updatePlayerCard() {
  const rank = getRank(progress.total_xp);
  const next = RANKS[rank.index + 1] || rank;
  const pct  = rank.index < RANKS.length - 1
    ? Math.min(100, ((progress.total_xp - rank.min) / (next.min - rank.min)) * 100)
    : 100;

  document.getElementById('rankLabel').textContent  = rank.name;
  document.getElementById('xpBar').style.width      = pct + '%';
  document.getElementById('xpCurrent').textContent  = progress.total_xp + ' XP';
  document.getElementById('xpNext').textContent     = rank.index < RANKS.length - 1 ? '→ ' + next.min + ' XP' : 'MAX RANK';
  document.getElementById('statStreak').textContent = progress.streak;
  document.getElementById('statXP').textContent     = progress.total_xp;
  document.getElementById('statDone').textContent   = tasks.filter(t => t.completed).length;

  if (rank.index > prevLevel) { prevLevel = rank.index; showLevelUp(rank.name); }
}

function showLevelUp(name) {
  playLevelUp();
  const ov = document.getElementById('levelupOverlay');
  document.getElementById('levelupText').textContent = 'RANK UP! ' + name;
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 2200);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ─── ARCS ────────────────────────────────────────────────────────────────
function renderArcs() {
  const el   = document.getElementById('arcSection');
  el.innerHTML = '';
  const done = tasks.filter(t => t.completed).length;
  el.appendChild(makeArcCard('TODAY', tasks.length ? done / tasks.length : 0, '#00e5ff', `${done}/${tasks.length}`));
  Object.keys(CATEGORIES).forEach(cat => {
    const ct = tasks.filter(t => t.category === cat);
    const cd = ct.filter(t => t.completed).length;
    el.appendChild(makeArcCard(CATEGORIES[cat].label.split(' ')[1] || cat, ct.length ? cd / ct.length : 0, CATEGORIES[cat].color, `${cd}/${ct.length}`));
  });
}

function makeArcCard(label, pct, color, countText) {
  const R = 28, C = 35, CIRC = 2 * Math.PI * R;
  const card = document.createElement('div');
  card.className = 'arc-card';
  card.innerHTML = `
    <div class="arc-label">${label}</div>
    <svg class="arc-svg" viewBox="0 0 70 70">
      <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--border)" stroke-width="5"/>
      <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${color}" stroke-width="5"
        stroke-dasharray="${CIRC * pct} ${CIRC}" stroke-dashoffset="${CIRC * 0.25}"
        stroke-linecap="round"
        style="transition:stroke-dasharray 0.6s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 4px ${color})"/>
      <text x="${C}" y="${C+1}" text-anchor="middle" dominant-baseline="middle"
        fill="${color}" font-family="Orbitron,monospace" font-size="11" font-weight="700">
        ${Math.round(pct * 100)}%
      </text>
    </svg>
    <div class="arc-count" style="color:${color}">${countText}</div>
  `;
  return card;
}

// ─── TASK LIST ────────────────────────────────────────────────────────────
function renderTasks() {
  const el = document.getElementById('taskLists');
  el.innerHTML = '';
  Object.keys(CATEGORIES).forEach(cat => {
    const ct  = tasks.filter(t => t.category === cat);
    const sec = document.createElement('div');
    sec.className = 'category-section';
    sec.innerHTML = `
      <div class="cat-header">
        <div class="cat-dot" style="background:${CATEGORIES[cat].color};box-shadow:0 0 6px ${CATEGORIES[cat].color}"></div>
        <div class="cat-title" style="color:${CATEGORIES[cat].color}">${CATEGORIES[cat].label}</div>
        <div class="cat-count">${ct.filter(t=>t.completed).length}/${ct.length} complete</div>
      </div>
    `;
    if (!ct.length) {
      sec.innerHTML += `<div class="empty-state">No quests yet — log your ${cat} wins</div>`;
    } else {
      ct.forEach(task => sec.appendChild(makeTaskEl(task)));
    }
    el.appendChild(sec);
  });
}

function makeTaskEl(task) {
  const el    = document.createElement('div');
  el.className = 'task-item' + (task.completed ? ' done' : '');
  el.id        = 'task-' + task.id;
  const color  = CATEGORIES[task.category]?.color || '#fff';
  el.innerHTML = `
    <div class="task-check ${task.completed ? 'checked' : ''}" onclick="toggleTask('${task.id}', ${task.completed})"
      style="${task.completed ? 'background:' + color + ';' : ''}">
      <svg viewBox="0 0 14 14" fill="none">
        <polyline points="2,7 6,11 12,3" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="task-text">${escHtml(task.title)}</div>
    <div class="task-xp" style="color:${color};border-color:${color}40">+${task.xp} XP</div>
    <button class="task-delete" onclick="removeTask('${task.id}', ${task.xp}, ${task.completed})">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <line x1="2" y1="2" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="2" x2="2" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  `;
  return el;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────
async function addTask() {
  const input = document.getElementById('taskInput');
  const cat   = document.getElementById('catSelect').value;
  const title = input.value.trim();
  if (!title) { showToast('Write your quest first'); return; }
  try {
    const [saved] = await insertTask({ title, category: cat, completed: false, xp: CATEGORIES[cat].xp, date: todayStr });
    tasks.push(saved);
    input.value = '';
    playAdd();
    renderTasks(); renderArcs(); updatePlayerCard();
    showToast('Quest added! +' + CATEGORIES[cat].xp + ' XP on completion');
  } catch(e) { showToast('Error saving quest'); console.error(e); }
}

async function toggleTask(id, wasDone) {
  const nowDone = !wasDone;
  const task    = tasks.find(t => t.id == id);
  if (!task) return;
  try {
    await updateTask(id, { completed: nowDone });
    task.completed = nowDone;
    if (nowDone) { progress.total_xp += task.xp; playComplete(); showToast('Quest complete! +' + task.xp + ' XP'); }
    else         { progress.total_xp = Math.max(0, progress.total_xp - task.xp); }
    progress.last_active_date = todayStr;
    await saveProgress(progress);
    renderTasks(); renderArcs(); updatePlayerCard();
  } catch(e) { showToast('Sync error'); console.error(e); }
}

async function removeTask(id, xp, wasDone) {
  try {
    await deleteTask(id);
    if (wasDone) progress.total_xp = Math.max(0, progress.total_xp - xp);
    tasks = tasks.filter(t => t.id != id);
    await saveProgress(progress);
    renderTasks(); renderArcs(); updatePlayerCard();
    showToast('Quest removed');
  } catch(e) { showToast('Delete error'); console.error(e); }
}

// ─── INIT ─────────────────────────────────────────────────────────────────
function setSyncStatus(s) {
  document.getElementById('syncDot').className   = 'sync-dot ' + (s === 'live' ? 'live' : s === 'error' ? 'error' : '');
  document.getElementById('syncLabel').textContent = s === 'live' ? 'synced' : s === 'error' ? 'offline' : 'connecting...';
}

async function init() {
  document.getElementById('dateBadge').textContent =
    new Date().toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
  setSyncStatus('connecting');
  try {
    const [rawTasks, rawProg] = await Promise.all([loadTasks(), loadProgress()]);
    tasks = rawTasks || [];
    if (rawProg && rawProg.length) {
      progress = rawProg[0];
      progress.streak = calcStreak(rawProg[0]);
      if (rawProg[0].last_active_date !== todayStr)
        await saveProgress({ streak: progress.streak, last_active_date: todayStr });
    } else {
      progress = { total_xp: 0, streak: 1, level: 0, last_active_date: todayStr };
      await saveProgress(progress);
    }
    prevLevel = getRank(progress.total_xp).index;
    renderTasks(); renderArcs(); updatePlayerCard();
    setSyncStatus('live');
  } catch(e) {
    setSyncStatus('error');
    showToast('Could not connect to Supabase');
    console.error(e);
  }
}

document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
init();
</script>
